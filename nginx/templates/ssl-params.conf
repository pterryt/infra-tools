# Shared TLS hardening, included by every SSL vhost.
# Installed to /etc/nginx/ssl-params.conf by setup-nginx.sh

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers HIGH:!aNULL:!MD5;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling (requires a resolver to actually staple at runtime;
# nginx -t passes without one, but add this if stapling silently isn't
# working: resolver 1.1.1.1 8.8.8.8 valid=300s;)
ssl_stapling on;
ssl_stapling_verify on;
